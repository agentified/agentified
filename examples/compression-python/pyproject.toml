[project]
name = "ratel-example-compression"
version = "0.0.0"
description = "Ratel experimental prompt compression — compress the context, keep the scaffolding"
requires-python = ">=3.10"
dependencies = [
    "ratel-ai",
]

[tool.uv.sources]
# Use the local SDK from this monorepo rather than PyPI.
# `editable` so the example tracks the working tree. Without it uv installs a
# copy on first run and never refreshes it, and you end up debugging a build
# from several changes ago.
ratel-ai = { path = "../../src/sdk/python", editable = true }
