[package]
name = "ratel-ai-core"
version = "0.12.0-rc.4" # core-v* release unit (ADR-0008)
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme = "README.md"
description = "Tool and skill retrieval for AI agents — selectable BM25, dense (semantic), or hybrid search over catalogs. Core of the Ratel context engineering platform."
keywords = ["mcp", "ai-agents", "tool-calling", "embeddings", "retrieval"]
categories = ["text-processing", "algorithms"]

[dependencies]
bm25 = "2.3"
# Id-keyed, insertion-ordered corpus storage: `register` replaces in place so a
# re-registered id never duplicates (see ToolRegistry/DenseCache, RAT-378).
indexmap = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
# Cross-language catalog-definition telemetry hashes (protocol v2 ETags stay separate).
serde_json_canonicalizer = "0.3"
ulid = "1"

# Dense (semantic) retrieval — pure-Rust Candle inference, no C++/ONNX native
# dep, so the SDK wheels/addons stay clean cross-platform. `hf-hub` fetches the
# model on first use into the shared HuggingFace cache (sync `ureq` backend,
# rustls — no OpenSSL/native-tls). See ADR-0011.
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
# `fancy-regex` is the pure-Rust regex backend; `onig` pulls oniguruma (C) via
# onig_sys, which breaks cross-compilation to aarch64-linux for the SDK
# wheels/addons. BERT WordPiece tokenization is unaffected by the backend.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }

# Sync HTTP client for OpenAI-compatible embedding endpoints (OpenAI, Ollama,
# TEI, vLLM…). Already in-tree via hf-hub's `ureq` feature; rustls to match it —
# no OpenSSL/native-tls. See ADR-0012.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

# Content digests for Local embedding fingerprints (path is not identity). See ADR-0012.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
